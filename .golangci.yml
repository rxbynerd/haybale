version: "2"

linters:
  enable:
    # The default linter set has no security-focused analyzer; gosec covers
    # common credential, filesystem, subprocess, and HTTP hazards.
    - gosec

formatters:
  enable:
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/rxbynerd/haybale)
